<div class="ia-container">

    <h1>Asistente IA</h1>

    <p class="subtitulo">
        Analiza automáticamente solicitudes
    </p>

    <textarea
    [(ngModel)]="descripcion"
    placeholder="Escriba la descripción">
    </textarea>

    <button (click)="analizar()">

        Analizar solicitud

    </button>

    @if(resultado){

        <div class="resultado">

            <h3>Resultado IA</h3>

            <p>
                <strong>Categoría:</strong>
                {{resultado.categoria}}
            </p>

            <p>
                <strong>Prioridad:</strong>
                {{resultado.prioridad}}
            </p>

            <p>
                <strong>Confianza:</strong>
                {{resultado.confianza}}
            </p>

            <p>
                <strong>Explicación:</strong>
                {{resultado.explicacion}}
            </p>

        </div>

    }

</div>
