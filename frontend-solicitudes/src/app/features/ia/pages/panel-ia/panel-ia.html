<h2>Panel IA</h2>

<textarea
  [(ngModel)]="descripcion"
  placeholder="Ingrese descripción de la solicitud">
</textarea>

<br><br>

<button (click)="analizar()">
  Analizar
</button>

@if(resultado){

<div>

  <h3>Resultado</h3>

  <p>
    <b>Categoría:</b>
    {{resultado.categoria}}
  </p>

  <p>
    <b>Prioridad:</b>
    {{resultado.prioridad}}
  </p>

  <p>
    <b>Confianza:</b>
    {{resultado.confianza}}
  </p>

  <p>
    <b>Explicación:</b>
    {{resultado.explicacion}}
  </p>

</div>

}
