<div class="container">

    <div class="sidebar">

        <div class="logo">

            <h1>GESTOR</h1>
            <h1>SOLICITUDES</h1>

        </div>

    </div>


    <div class="contenido">

        <div class="header">

            <h1>Asistente Inteligente</h1>

            <p>
                Analiza automáticamente solicitudes y genera sugerencias
            </p>

        </div>


        <div class="panel">

            <label>

                Descripción de la solicitud

            </label>

            <textarea
            [(ngModel)]="descripcion"
            placeholder="Escriba aquí la descripción de la solicitud">
            </textarea>

            <button (click)="analizar()">

                Analizar solicitud

            </button>

        </div>


        @if(resultado){

        <h2 class="titulo-seccion">

            IA

        </h2>


        <div class="cards">

            <div class="card">

                <h3>Categoría</h3>

                <p>

                    {{resultado.categoria}}

                </p>

            </div>


            <div class="card">

                <h3>Prioridad</h3>

                <p>

                    {{resultado.prioridad}}

                </p>

            </div>


            <div class="card">

                <h3>Confianza</h3>

                <p>

                    {{resultado.confianza}}

                </p>

            </div>

        </div>


        <div class="resultado">

            <h2>

                Resultado IA

            </h2>

            <p>

                {{resultado.explicacion}}

            </p>

        </div>

        }

    </div>

</div>
