<div class="historial-container">

    <h1>Historial de Solicitudes</h1>
    <p class="subtitulo">
        Seguimiento de cambios realizados en la solicitud
    </p>

    @if(historial.length > 0){

        @for(item of historial; track item.id){

            <div class="card">

                <div class="card-header">

                    <span class="fecha">
                        {{item.fecha}}
                    </span>

                    <span class="accion">
                        {{item.accion}}
                    </span>

                </div>

                <div class="card-body">

                    <p>
                        {{item.descripcion}}
                    </p>

                </div>

            </div>

        }

    }

    @else {

        <div class="sin-datos">

            <h3>No hay historial disponible</h3>

            <p>
                La solicitud aún no tiene movimientos registrados
            </p>

        </div>

    }

</div>
